repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, typescript, json, yaml, markdown, html, css]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: npx eslint
        language: system
        types: [typescript, tsx]
        require_serial: true
        args: ["--fix", "--max-warnings=0"]
        pass_filenames: true
        exclude: '^(node_modules|dist|build|out)/'

      - id: jest-test
        name: Jest Tests
        entry: npx jest
        language: system
        types: [typescript, tsx]
        require_serial: true
        args: ["--passWithNoTests", "--testPathPattern=src/__tests__"]
        pass_filenames: false
        exclude: '^(node_modules|dist|build|out)/'