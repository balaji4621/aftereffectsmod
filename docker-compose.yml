version: '3.8'

services:
  antigravity:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./public:/app/public:ro
      - ./out:/app/out
      - ./ae_presets:/app/ae_presets
      - ./src/generated:/app/src/generated
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Redis for caching (if needed in future)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   restart: unless-stopped

