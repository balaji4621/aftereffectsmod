name: Antigravity CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11"]
    env:
      # Serverless docs: https://www.serverless.com/framework/docs/providers/aws/guides/credentials/
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔧 Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📥 Install npm dependencies
        run: npm ci

      - name: ✅ Run Jest tests
        run: npm run test

      - name: 📏 Run ESLint
        run: npm run lint

      - name: 📦 Check TypeScript
        run: npm run typecheck

  build:
    name: Build and Lint
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Run pre-commit
        uses: pre-commit/action@v3.0.0

      - name: 📦 Build Remotion project
        run: npm run build

      - name: 📦 Check TypeScript
        run: npm run typecheck

  deploy:
    name: Docker Build
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐋 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Get version
        id: version
        run: |
          echo "version=$(git describe --tags --always)" >> $GITHUB_ENV

      - name: 🏷️ Login to Docker Hub
        if: secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_PASSWORD
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/antigravity:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/antigravity:${{ env.version }}
          cache-from: type=registry,registry=index.docker.io/antigravity-cache
          cache-to: type=registry,registry=index.docker.io/antigravity-cache,mode=max

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Snyk vulnerability scan
        uses: snyk/actions@master
        with:
          command: test
          arg: --file=package.json

      - name: 🔍 Dependencies audit
        run: npm audit --production

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4

      - init: codeql

      - name: ✨ Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: 🏃 Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/ticket"
          category: "good first issue"